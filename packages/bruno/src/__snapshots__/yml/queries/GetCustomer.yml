info:
  name: "GetCustomer"
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphql-gateway}}/graphql"
  body:
    query: |-
      query GetCustomer($info: CustomerInfo!) {
        customer(info: $info) {
          ...CustomerDetails
        }
      }

      fragment CustomerDetails on Customer {
        firstName
        email
        addresses {
          ...AddressDetails
        }
      }

      fragment AddressDetails on Address {
        id
        city
      }
    variables: |-
      {
        "info": {
          "credentials": {
            "email": "example",
            "password": "example"
          },
          "authMethod": "EMAIL"
        }
      }
